name: GitHub Actions CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install deps
        run: go mod tidy

      - name: Build
        run: go build -o valentine_bot ./cmd/server

      - name: Test
        run: go test ./...
